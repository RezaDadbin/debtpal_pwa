<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DebtPal" />
  <meta name="theme-color" content="#f7f3eb" />
  <title>DebtPal</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <div class="top">
      <div class="brand-row">
        <div class="brand">
          <h1>DebtPal</h1>
          <span id="subtitle">Local debt manager</span>
        </div>

        <div class="top-actions">
          <button class="tiny dark" onclick="addAccounting()">Add accounting</button>
          <button class="tiny ghost" onclick="showImexPage()">ImEx</button>
        </div>
      </div>
    </div>

    <main id="accountingsPage" class="page">
      <div id="accountingsList"></div>
    </main>

    <main id="settlementPage" class="page hidden">
      <section class="card">
        <div class="card-head">
          <div>
            <h2 class="title">Settlement</h2>
            <div class="subtitle">Choose an accounting and calculate who should pay whom.</div>
          </div>
        </div>

        <select id="settlementSelect" onchange="renderSettlementPage()"></select>

        <div id="settlementContent"></div>
      </section>
    </main>

    <main id="imexPage" class="page hidden">
      <section class="card">
        <h2 class="title">Import / Export</h2>
        <p class="note">Data is automatically saved on this phone. Use backups to protect or move your data.</p>

        <div class="imex-grid">
          <button class="imex-button" onclick="exportFullBackup()">
            <div>
              <strong>Backup everything</strong>
              <span>Export all accountings into one JSON file.</span>
            </div>
            <div class="arrow">↓</div>
          </button>

          <button class="imex-button" onclick="document.getElementById('fullImportFile').click()">
            <div>
              <strong>Import full backup</strong>
              <span>Replace all current data with a full backup.</span>
            </div>
            <div class="arrow">↑</div>
          </button>

          <button class="imex-button" onclick="document.getElementById('accountingImportFile').click()">
            <div>
              <strong>Import one accounting</strong>
              <span>Import one saved accounting file.</span>
            </div>
            <div class="arrow">＋</div>
          </button>

          <button class="imex-button" onclick="copyRawJSON()">
            <div>
              <strong>Copy raw JSON</strong>
              <span>Copy all current app data as text.</span>
            </div>
            <div class="arrow">⧉</div>
          </button>
        </div>

        <input id="fullImportFile" type="file" accept="application/json" class="hidden" onchange="importFullBackup(event)" />
        <input id="accountingImportFile" type="file" accept="application/json" class="hidden" onchange="importOneAccounting(event)" />

        <div class="storage-box" id="storageInfo">
          Storage: local browser storage on this phone.
        </div>
      </section>
    </main>
  </div>

  <nav class="nav">
    <button id="accountingsTab" class="active" onclick="showAccountingsPage()">Accountings</button>
    <button id="settlementTab" onclick="showSettlementPage()">Settlement</button>
  </nav>

  <script>
    const STORAGE_KEY = "debtpal_pwa_data_v1";

    let data = loadData();
    let expandedAccountingId = null;
    let expandedDebtId = null;

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now() + Math.random());
    }

    function todayISO() {
      const d = new Date();
      const y = d.getFullYear();
      const m = String(d.getMonth() + 1).padStart(2, "0");
      const day = String(d.getDate()).padStart(2, "0");
      return `${y}-${m}-${day}`;
    }

    function money(n) {
      const x = Number(n || 0);
      return x.toLocaleString(undefined, { maximumFractionDigits: 2 });
    }

    function safeName(str) {
      return String(str || "accounting")
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "")
        .slice(0, 60) || "accounting";
    }

    function loadData() {
      try {
        return JSON.parse(localStorage.getItem(STORAGE_KEY)) || { accountings: [] };
      } catch {
        return { accountings: [] };
      }
    }

    function saveData() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      updateSubtitle();
      updateStorageInfo();
    }

    function getAccountings() {
      data.accountings = data.accountings || [];
      return data.accountings;
    }

    function getAccounting(id) {
      return getAccountings().find(a => a.id === id);
    }

    function getAccountingStats(acc) {
      const debtItems = acc.debtItems || [];
      const people = new Set();
      let total = 0;

      for (const item of debtItems) {
        total += Number(item.price || 0);
        for (const p of item.payers || []) people.add(p.name.trim());
        for (const p of item.involvedPeople || []) people.add(String(p).trim());
      }

      return {
        total,
        debtCount: debtItems.length,
        peopleCount: Array.from(people).filter(Boolean).length
      };
    }

    function calculateSettlement(acc) {
      const balances = {};

      for (const item of acc.debtItems || []) {
        const price = Number(item.price || 0);
        const involved = (item.involvedPeople || []).map(x => String(x).trim()).filter(Boolean);
        const payers = (item.payers || []).filter(p => p.name && Number(p.amount) > 0);

        if (!involved.length) continue;

        const share = price / involved.length;

        for (const person of involved) {
          balances[person] = (balances[person] || 0) - share;
        }

        for (const payer of payers) {
          const name = payer.name.trim();
          balances[name] = (balances[name] || 0) + Number(payer.amount || 0);
        }
      }

      const debtors = [];
      const creditors = [];

      for (const [person, amount] of Object.entries(balances)) {
        const rounded = Math.round(amount * 100) / 100;
        if (rounded < -0.009) debtors.push({ person, amount: -rounded });
        if (rounded > 0.009) creditors.push({ person, amount: rounded });
      }

      debtors.sort((a, b) => b.amount - a.amount);
      creditors.sort((a, b) => b.amount - a.amount);

      const payments = [];
      let i = 0, j = 0;

      while (i < debtors.length && j < creditors.length) {
        const payment = Math.min(debtors[i].amount, creditors[j].amount);
        const roundedPayment = Math.round(payment * 100) / 100;

        if (roundedPayment > 0) {
          payments.push({
            from: debtors[i].person,
            to: creditors[j].person,
            amount: roundedPayment
          });
        }

        debtors[i].amount = Math.round((debtors[i].amount - payment) * 100) / 100;
        creditors[j].amount = Math.round((creditors[j].amount - payment) * 100) / 100;

        if (debtors[i].amount <= 0.009) i++;
        if (creditors[j].amount <= 0.009) j++;
      }

      const finalBalances = Object.entries(balances)
        .map(([person, amount]) => ({
          person,
          amount: Math.round(amount * 100) / 100
        }))
        .filter(x => Math.abs(x.amount) > 0.009)
        .sort((a, b) => b.amount - a.amount);

      return { finalBalances, payments };
    }

    function updateSubtitle() {
      const accs = getAccountings();
      const totalDebt = accs.reduce((sum, acc) => sum + getAccountingStats(acc).total, 0);
      document.getElementById("subtitle").textContent =
        `${accs.length} accounting(s), total ${money(totalDebt)}`;
    }

    function render() {
      updateSubtitle();
      renderAccountings();

      if (!document.getElementById("settlementPage").classList.contains("hidden")) {
        renderSettlementPage();
      }

      if (!document.getElementById("imexPage").classList.contains("hidden")) {
        updateStorageInfo();
      }
    }

    function renderAccountings() {
      const list = document.getElementById("accountingsList");
      const accs = getAccountings().sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));

      list.innerHTML = "";

      if (!accs.length) {
        list.innerHTML = `
          <section class="card welcome-card">
            <div class="welcome-content">
              <div class="welcome-kicker">PRIVATE LOCAL DEBT MANAGER</div>
              <h2 class="welcome-title">Organize debts without a backend.</h2>
              <p class="note">
                Create an accounting, add debt items, define who paid and who was involved,
                and DebtPal will calculate final balances and settlement payments.
                Everything is saved locally on this device.
              </p>

              <div class="welcome-mini-grid">
                <div class="welcome-mini"><b>1</b><span>Create accounting</span></div>
                <div class="welcome-mini"><b>2</b><span>Add debt items</span></div>
                <div class="welcome-mini"><b>3</b><span>Set payers + people</span></div>
                <div class="welcome-mini"><b>4</b><span>Calculate settlement</span></div>
              </div>

              <div class="welcome-actions">
                <button class="primary" onclick="addAccounting()">Add accounting</button>
                <button class="ghost" onclick="showImexPage()">Import backup</button>
              </div>
            </div>
          </section>
        `;
        return;
      }

      for (const acc of accs) {
        acc.debtItems = acc.debtItems || [];
        const stats = getAccountingStats(acc);
        const isExpanded = expandedAccountingId === acc.id;

        const card = document.createElement("section");
        card.className = "card";

        card.innerHTML = `
          <div class="card-head">
            <div>
              <h2 class="title">${escapeHTML(acc.name)}</h2>
              <div class="subtitle">${acc.createdAt ? new Date(acc.createdAt).toLocaleDateString() : ""}</div>
            </div>

            <div style="text-align:right">
              <div class="score-pill">${money(stats.total)}</div>
              <div class="card-tools">
                <button class="tiny ghost" onclick="toggleAccounting('${acc.id}')">${isExpanded ? "Hide" : "Open"}</button>
                <button class="tiny good" onclick="exportOneAccounting('${acc.id}')">Export</button>
                <button class="tiny danger" onclick="deleteAccounting('${acc.id}')">Delete</button>
              </div>
            </div>
          </div>

          <div class="chips">
            <div class="chip"><b>Total</b><span>${money(stats.total)}</span></div>
            <div class="chip"><b>Debts</b><span>${stats.debtCount}</span></div>
            <div class="chip"><b>People</b><span>${stats.peopleCount}</span></div>
            <div class="chip"><b>Settlement</b><span>${calculateSettlement(acc).payments.length}</span></div>
          </div>

          ${isExpanded ? renderAccountingDetails(acc) : ""}
        `;

        list.appendChild(card);
      }
    }

    function renderAccountingDetails(acc) {
      return `
        <div class="details">
          <div class="form">
            <div class="form-title">Add debt item</div>

            <div class="form-row-3">
              <input id="debtName-${acc.id}" placeholder="Debt title" autocomplete="off" />
              <input id="debtPrice-${acc.id}" placeholder="Amount" type="number" min="0" step="any" inputmode="decimal" />
              <input id="debtDate-${acc.id}" type="date" value="${todayISO()}" />
            </div>

            <textarea id="debtComment-${acc.id}" placeholder="Comment / note"></textarea>

            <div class="section-label">Payers</div>
            <div class="people-box" id="payers-${acc.id}">
              ${payerRowHTML(acc.id, 1)}
            </div>
            <button class="small ghost" onclick="addPayerRow('${acc.id}')">+ Add payer</button>

            <div class="section-label">Involved people</div>
            <div class="people-box" id="people-${acc.id}">
              ${personRowHTML(acc.id, 1)}
            </div>
            <button class="small ghost" onclick="addPersonRow('${acc.id}')">+ Add person</button>

            <button class="primary" onclick="addDebtItem('${acc.id}')">Save Debt Item</button>
          </div>

          <div class="debt-list" id="debtList-${acc.id}">
            ${renderDebtItems(acc)}
          </div>
        </div>
      `;
    }

    function payerRowHTML(accId, index) {
      return `
        <div class="payer-row">
          <input class="payer-name-${accId}" placeholder="Payer ${index} name" autocomplete="off" />
          <input class="payer-amount-${accId}" placeholder="Paid" type="number" min="0" step="any" inputmode="decimal" />
          <button class="small danger" onclick="this.parentElement.remove()">−</button>
        </div>
      `;
    }

    function personRowHTML(accId, index) {
      return `
        <div class="person-row">
          <input class="person-name-${accId}" placeholder="Person ${index}" autocomplete="off" />
          <button class="small danger" onclick="this.parentElement.remove()">−</button>
        </div>
      `;
    }

    function renderDebtItems(acc) {
      if (!acc.debtItems || !acc.debtItems.length) {
        return `<div class="empty" style="margin-top:0">No debt items yet.</div>`;
      }

      return [...acc.debtItems]
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))
        .map(item => {
          const isDebtExpanded = expandedDebtId === item.id;
          const payers = (item.payers || []).map(p => `<span class="tag">${escapeHTML(p.name)} paid ${money(p.amount)}</span>`).join("");
          const people = (item.involvedPeople || []).map(p => `<span class="tag">${escapeHTML(p)}</span>`).join("");

          return `
            <div class="debt-item">
              <div class="debt-top">
                <div>
                  <div class="debt-name">${escapeHTML(item.name)}</div>
                  <div class="muted">${item.date || ""}</div>
                </div>
                <div class="debt-amount">${money(item.price)}</div>
              </div>

              ${isDebtExpanded ? `
                <div style="margin-top:10px">
                  <div class="section-label">Payers</div>
                  <div>${payers || "<span class='muted'>No payers</span>"}</div>

                  <div class="section-label">Involved people</div>
                  <div>${people || "<span class='muted'>No involved people</span>"}</div>

                  ${item.comment ? `<p class="note">${escapeHTML(item.comment)}</p>` : ""}
                </div>
              ` : ""}

              <div class="debt-actions">
                <button class="small ghost" onclick="toggleDebt('${item.id}')">${isDebtExpanded ? "Hide" : "Details"}</button>
                <button class="small ghost" onclick="editDebtItem('${acc.id}', '${item.id}')">Edit</button>
                <button class="small danger" onclick="deleteDebtItem('${acc.id}', '${item.id}')">Delete</button>
              </div>
            </div>
          `;
        })
        .join("");
    }

    function addPayerRow(accId) {
      const box = document.getElementById(`payers-${accId}`);
      if (!box) return;
      const count = box.querySelectorAll(".payer-row").length + 1;
      box.insertAdjacentHTML("beforeend", payerRowHTML(accId, count));
    }

    function addPersonRow(accId) {
      const box = document.getElementById(`people-${accId}`);
      if (!box) return;
      const count = box.querySelectorAll(".person-row").length + 1;
      box.insertAdjacentHTML("beforeend", personRowHTML(accId, count));
    }

    function addAccounting() {
      const name = prompt("Accounting name?", "Trip / Home / Project");
      if (!name || !name.trim()) return;

      const acc = {
        id: uid(),
        name: name.trim(),
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString(),
        debtItems: []
      };

      getAccountings().push(acc);
      expandedAccountingId = acc.id;
      expandedDebtId = null;

      saveData();
      render();
    }

    function toggleAccounting(id) {
      expandedAccountingId = expandedAccountingId === id ? null : id;
      expandedDebtId = null;
      render();
    }

    function deleteAccounting(id) {
      const acc = getAccounting(id);
      if (!acc) return;

      if (!confirm(`Delete "${acc.name}" and all its debt items?`)) return;

      data.accountings = getAccountings().filter(a => a.id !== id);
      if (expandedAccountingId === id) expandedAccountingId = null;

      saveData();
      render();
    }

    function addDebtItem(accId) {
      const acc = getAccounting(accId);
      if (!acc) return;

      const name = document.getElementById(`debtName-${accId}`).value.trim();
      const price = Number(document.getElementById(`debtPrice-${accId}`).value);
      const date = document.getElementById(`debtDate-${accId}`).value;
      const comment = document.getElementById(`debtComment-${accId}`).value.trim();

      if (!name) {
        alert("Debt title is required.");
        return;
      }

      if (!price || price <= 0) {
        alert("Amount must be positive.");
        return;
      }

      const payerNames = Array.from(document.querySelectorAll(`.payer-name-${accId}`));
      const payerAmounts = Array.from(document.querySelectorAll(`.payer-amount-${accId}`));

      const payers = payerNames.map((input, i) => ({
        name: input.value.trim(),
        amount: Number(payerAmounts[i]?.value || 0)
      })).filter(p => p.name && p.amount > 0);

      const involvedPeople = Array.from(document.querySelectorAll(`.person-name-${accId}`))
        .map(input => input.value.trim())
        .filter(Boolean);

      if (!payers.length) {
        alert("Add at least one payer.");
        return;
      }

      if (!involvedPeople.length) {
        alert("Add at least one involved person.");
        return;
      }

      const sumPaid = payers.reduce((sum, p) => sum + p.amount, 0);
      if (Math.abs(sumPaid - price) > 0.01) {
        alert(`Payers total (${money(sumPaid)}) must equal amount (${money(price)}).`);
        return;
      }

      const item = {
        id: uid(),
        name,
        price,
        date: date || todayISO(),
        comment,
        payers,
        involvedPeople,
        createdAt: new Date().toISOString(),
        updatedAt: new Date().toISOString()
      };

      acc.debtItems = acc.debtItems || [];
      acc.debtItems.push(item);
      acc.updatedAt = new Date().toISOString();

      expandedAccountingId = accId;
      expandedDebtId = item.id;

      saveData();
      render();
    }

    function toggleDebt(debtId) {
      expandedDebtId = expandedDebtId === debtId ? null : debtId;
      render();
    }

    function editDebtItem(accId, debtId) {
      const acc = getAccounting(accId);
      if (!acc) return;

      const item = (acc.debtItems || []).find(d => d.id === debtId);
      if (!item) return;

      const newName = prompt("Debt title:", item.name);
      if (!newName || !newName.trim()) return;

      const newPrice = Number(prompt("Amount:", item.price));
      if (!newPrice || newPrice <= 0) {
        alert("Amount must be positive.");
        return;
      }

      const newDate = prompt("Date YYYY-MM-DD:", item.date || todayISO());
      if (!newDate) return;

      const newComment = prompt("Comment:", item.comment || "") ?? "";

      item.name = newName.trim();
      item.price = newPrice;
      item.date = newDate;
      item.comment = newComment.trim();
      item.updatedAt = new Date().toISOString();

      expandedAccountingId = accId;
      expandedDebtId = debtId;

      saveData();
      render();
    }

    function deleteDebtItem(accId, debtId) {
      const acc = getAccounting(accId);
      if (!acc) return;

      if (!confirm("Delete this debt item?")) return;

      acc.debtItems = (acc.debtItems || []).filter(d => d.id !== debtId);
      acc.updatedAt = new Date().toISOString();

      if (expandedDebtId === debtId) expandedDebtId = null;

      saveData();
      render();
    }

    function renderSettlementPage() {
      const select = document.getElementById("settlementSelect");
      const content = document.getElementById("settlementContent");
      const accs = getAccountings();

      const currentValue = select.value;

      select.innerHTML = accs.map(acc => `
        <option value="${acc.id}">${escapeHTML(acc.name)}</option>
      `).join("");

      if (currentValue && accs.some(a => a.id === currentValue)) {
        select.value = currentValue;
      }

      if (!accs.length) {
        content.innerHTML = `<div class="empty">No accountings yet.</div>`;
        return;
      }

      const acc = getAccounting(select.value) || accs[0];
      select.value = acc.id;

      const stats = getAccountingStats(acc);
      const settlement = calculateSettlement(acc);

      content.innerHTML = `
        <div class="chips" style="margin-top:12px">
          <div class="chip"><b>Total</b><span>${money(stats.total)}</span></div>
          <div class="chip"><b>Debts</b><span>${stats.debtCount}</span></div>
          <div class="chip"><b>People</b><span>${stats.peopleCount}</span></div>
          <div class="chip"><b>Payments</b><span>${settlement.payments.length}</span></div>
        </div>

        <h3 style="margin:18px 0 0; letter-spacing:-0.03em;">Who pays whom</h3>
        <div class="settlement-list">
          ${
            settlement.payments.length
              ? settlement.payments.map(p => `
                  <div class="settlement-row">
                    <div><strong>${escapeHTML(p.from)}</strong> pays <strong>${escapeHTML(p.to)}</strong></div>
                    <div class="amount-negative">${money(p.amount)}</div>
                  </div>
                `).join("")
              : `<div class="empty" style="margin-top:0">Everything is settled.</div>`
          }
        </div>

        <h3 style="margin:18px 0 0; letter-spacing:-0.03em;">Final balances</h3>
        <div class="balance-list">
          ${
            settlement.finalBalances.length
              ? settlement.finalBalances.map(b => `
                  <div class="balance-row">
                    <div>${escapeHTML(b.person)}</div>
                    <div class="${b.amount >= 0 ? "amount-positive" : "amount-negative"}">${money(b.amount)}</div>
                  </div>
                `).join("")
              : `<div class="empty" style="margin-top:0">No balances to show.</div>`
          }
        </div>

        <h3 style="margin:18px 0 0; letter-spacing:-0.03em;">Balance chart</h3>
        <div class="chart-wrap">
          <canvas id="balanceChart"></canvas>
        </div>
      `;

      setTimeout(() => drawBalanceChart(settlement.finalBalances), 0);
    }

    function prepareCanvas(canvas) {
      const ctx = canvas.getContext("2d");
      const ratio = window.devicePixelRatio || 1;
      const cssWidth = Math.max(canvas.clientWidth, 280);
      const cssHeight = Math.max(canvas.clientHeight, 220);

      canvas.width = Math.floor(cssWidth * ratio);
      canvas.height = Math.floor(cssHeight * ratio);

      ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
      return { ctx, w: cssWidth, h: cssHeight };
    }

    function drawBalanceChart(balances) {
      const canvas = document.getElementById("balanceChart");
      if (!canvas) return;

      const { ctx, w, h } = prepareCanvas(canvas);

      ctx.clearRect(0, 0, w, h);
      ctx.fillStyle = "#fffaf2";
      ctx.fillRect(0, 0, w, h);

      if (!balances || balances.length === 0) {
        ctx.fillStyle = "#746f66";
        ctx.font = "15px sans-serif";
        ctx.fillText("No balance data.", 24, h / 2);
        return;
      }

      const maxAbs = Math.max(...balances.map(b => Math.abs(b.amount)), 10);
      const left = 90;
      const right = 30;
      const top = 24;
      const bottom = 34;
      const zeroX = left + (w - left - right) / 2;
      const barH = Math.min(28, (h - top - bottom) / balances.length - 8);

      ctx.strokeStyle = "#eadfce";
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(zeroX, top);
      ctx.lineTo(zeroX, h - bottom);
      ctx.stroke();

      balances.forEach((b, i) => {
        const y = top + i * ((h - top - bottom) / balances.length) + 6;
        const width = (Math.abs(b.amount) / maxAbs) * ((w - left - right) / 2 - 10);

        ctx.fillStyle = "#746f66";
        ctx.font = "12px sans-serif";
        ctx.fillText(b.person.slice(0, 12), 12, y + barH * 0.7);

        ctx.fillStyle = b.amount >= 0 ? "#3f7d58" : "#b24035";
        const x = b.amount >= 0 ? zeroX : zeroX - width;
        ctx.beginPath();
        roundRect(ctx, x, y, width, barH, 7);
        ctx.fill();

        ctx.fillStyle = "#211f1a";
        ctx.font = "700 11px sans-serif";
        const label = money(b.amount);
        ctx.fillText(label, b.amount >= 0 ? x + width + 5 : x - 42, y + barH * 0.7);
      });
    }

    function roundRect(ctx, x, y, w, h, r) {
      ctx.moveTo(x + r, y);
      ctx.arcTo(x + w, y, x + w, y + h, r);
      ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r);
      ctx.arcTo(x, y, x + w, y, r);
      ctx.closePath();
    }

    function exportFullBackup() {
      downloadJSON({
        app: "DebtPal",
        type: "full-backup",
        version: 1,
        exportedAt: new Date().toISOString(),
        data
      }, `debtpal-full-backup-${todayISO()}.json`);
    }

    function exportOneAccounting(id) {
      const acc = getAccounting(id);
      if (!acc) return;

      downloadJSON({
        app: "DebtPal",
        type: "single-accounting",
        version: 1,
        exportedAt: new Date().toISOString(),
        accounting: acc
      }, `debtpal-accounting-${safeName(acc.name)}-${todayISO()}.json`);
    }

    function downloadJSON(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], {
        type: "application/json"
      });

      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    function importFullBackup(event) {
      const file = event.target.files[0];
      if (!file) return;

      readJSONFile(file, obj => {
        const imported = obj.data || obj;

        if (!imported.accountings || !Array.isArray(imported.accountings)) {
          alert("Invalid full backup.");
          return;
        }

        if (!confirm("This will replace all current DebtPal data. Continue?")) return;

        data = imported;
        expandedAccountingId = null;
        expandedDebtId = null;

        saveData();
        render();
        alert("Full backup imported.");
      });

      event.target.value = "";
    }

    function importOneAccounting(event) {
      const file = event.target.files[0];
      if (!file) return;

      readJSONFile(file, obj => {
        const acc = obj.accounting || obj;

        if (!acc.name || !Array.isArray(acc.debtItems)) {
          alert("Invalid accounting file.");
          return;
        }

        const existing = getAccountings().find(a => a.name.toLowerCase() === acc.name.toLowerCase());

        let imported = JSON.parse(JSON.stringify(acc));

        if (existing) {
          const choice = prompt(
            `Accounting "${acc.name}" already exists. Type:\nreplace = replace existing\ncopy = import as copy`,
            "copy"
          );

          if (!choice) return;

          if (choice.toLowerCase() === "replace") {
            imported.id = existing.id;
            imported.updatedAt = new Date().toISOString();
            data.accountings = getAccountings().map(a => a.id === existing.id ? imported : a);
            expandedAccountingId = imported.id;
          } else {
            imported.id = uid();
            imported.name = `${imported.name} Copy`;
            imported.createdAt = new Date().toISOString();
            imported.updatedAt = new Date().toISOString();
            imported.debtItems = (imported.debtItems || []).map(d => ({ ...d, id: uid() }));
            getAccountings().push(imported);
            expandedAccountingId = imported.id;
          }
        } else {
          imported.id = uid();
          imported.createdAt = imported.createdAt || new Date().toISOString();
          imported.updatedAt = new Date().toISOString();
          imported.debtItems = (imported.debtItems || []).map(d => ({ ...d, id: uid() }));
          getAccountings().push(imported);
          expandedAccountingId = imported.id;
        }

        saveData();
        render();
        alert("Accounting imported.");
      });

      event.target.value = "";
    }

    function readJSONFile(file, callback) {
      const reader = new FileReader();
      reader.onload = e => {
        try {
          callback(JSON.parse(e.target.result));
        } catch {
          alert("Could not read JSON file.");
        }
      };
      reader.readAsText(file);
    }

    async function copyRawJSON() {
      const text = JSON.stringify(data, null, 2);

      try {
        await navigator.clipboard.writeText(text);
        alert("JSON copied.");
      } catch {
        prompt("Copy this JSON:", text);
      }
    }

    function updateStorageInfo() {
      const el = document.getElementById("storageInfo");
      if (!el) return;

      const accs = getAccountings();
      const debts = accs.reduce((sum, a) => sum + ((a.debtItems || []).length), 0);
      const bytes = new Blob([JSON.stringify(data)]).size;
      const kb = (bytes / 1024).toFixed(1);

      el.innerHTML = `
        <strong style="color:var(--text)">Storage info</strong><br>
        ${accs.length} accounting(s), ${debts} debt item(s), about ${kb} KB.<br>
        Saved automatically in local browser storage on this phone.
      `;
    }

    function showAccountingsPage() {
      document.getElementById("accountingsPage").classList.remove("hidden");
      document.getElementById("settlementPage").classList.add("hidden");
      document.getElementById("imexPage").classList.add("hidden");

      document.getElementById("accountingsTab").classList.add("active");
      document.getElementById("settlementTab").classList.remove("active");

      window.scrollTo({ top: 0, behavior: "smooth" });
      render();
    }

    function showSettlementPage() {
      document.getElementById("accountingsPage").classList.add("hidden");
      document.getElementById("settlementPage").classList.remove("hidden");
      document.getElementById("imexPage").classList.add("hidden");

      document.getElementById("accountingsTab").classList.remove("active");
      document.getElementById("settlementTab").classList.add("active");

      renderSettlementPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function showImexPage() {
      document.getElementById("accountingsPage").classList.add("hidden");
      document.getElementById("settlementPage").classList.add("hidden");
      document.getElementById("imexPage").classList.remove("hidden");

      document.getElementById("accountingsTab").classList.remove("active");
      document.getElementById("settlementTab").classList.remove("active");

      updateStorageInfo();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function escapeHTML(str) {
      return String(str ?? "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    window.addEventListener("resize", () => {
      if (!document.getElementById("settlementPage").classList.contains("hidden")) {
        renderSettlementPage();
      }
    });

    render();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(err => {
          console.log("Service worker registration failed:", err);
        });
      });
    }
  </script>

</body>
